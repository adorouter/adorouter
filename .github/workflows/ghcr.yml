name: GHCR Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - renovate.json

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The image build skips typecheck and lint (next.config.ts ignoreBuildErrors),
  # so they gate it here.
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.check }}

  build:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The legal notice is empty until these are set, which must be fixed before launch.
      - name: Check legal notice secrets
        env:
          LEGAL_NAME: ${{ secrets.LEGAL_NAME }}
          LEGAL_ADDRESS: ${{ secrets.LEGAL_ADDRESS }}
        run: |
          for v in LEGAL_NAME LEGAL_ADDRESS; do
            [ -n "${!v}" ] || echo "::warning::secret $v is missing, so the legal notice is incomplete"
          done

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_LEGAL_NAME=${{ secrets.LEGAL_NAME }}
            NEXT_PUBLIC_LEGAL_ADDRESS=${{ secrets.LEGAL_ADDRESS }}
            NEXT_PUBLIC_LEGAL_VAT_ID=${{ secrets.LEGAL_VAT_ID }}
          tags: |
            ghcr.io/adorouter/adorouter:latest
            ghcr.io/adorouter/adorouter:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
